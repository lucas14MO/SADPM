services:
  postgis:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sadpm}
      POSTGRES_USER: ${POSTGRES_USER:-sadpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sadpm-local}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      VITE_USE_MOCK_DATA: "false"
      VITE_API_BASE_URL: "http://127.0.0.1:${DJANGO_PORT:-8000}/api"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgis_data:
  media_data:
  frontend_node_modules: